name: Benchmark

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    # never, for every step by default: ensure-images below is the only
    # line allowed to pull/build anything, via an explicit override. If a
    # later step ever needs an image ensure-images didn't already cover
    # (its target list drifted out of sync with what `bench` actually
    # needs, say), that's a bug we want a loud CI failure for, not a
    # silent extra pull/build quietly corrupting that step's timing.
    env:
      PHP_BENCH_PULL_POLICY: never
      PHP_BENCH_BUILD_POLICY: never
    steps:
      - uses: tianon/actions/checkout/composite@169a61f86f2bdd62a21837ab30aeb1ea4c23bdbe # HEAD

      # 8.6 is ZTS-only upstream (docker-library/php#1686), so the NTS arm
      # has to be built here from the official Dockerfile with --enable-zts
      # removed; php-bench/* tags are local-only (run.sh never pulls them)
      - name: build nts 8.6
        run: docker build -t php-bench/nts-8.6 images/nts-8.6

      - name: ensure-images
        run: ./run.sh ensure-images --pull --build

      # CPU suite only, in the NTS-vs-ZTS pairing this fork exists for
      # (https://github.com/docker-library/php/issues/1719): four rounds,
      # back to back, so round-over-round stability is visible in the
      # artifact (r1-r3 archived, round 4 left in results/).
      - name: cpu (4 rounds)
        run: |
          for i in 1 2 3; do
            ./run.sh bench cpu
            mkdir -p "r$i" && cp results/cpu/*.json "r$i/"
          done
          ./run.sh bench cpu

      - name: round stability check
        run: python3 .github/compare_rounds.py r1 r2 r3 results/cpu | tee -a "$GITHUB_STEP_SUMMARY"

      - name: summary
        run: ./run.sh summarize | tee -a "$GITHUB_STEP_SUMMARY"
        if: always()

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ github.sha }}
          path: |
            results/
            r1/
            r2/
            r3/
        if: always()
